# This rule is not used by the project platform-mesh-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over operations.openkcm.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform-mesh-controller
    app.kubernetes.io/managed-by: kustomize
  name: operations-domainkey-admin-role
rules:
- apiGroups:
  - operations.openkcm.io
  resources:
  - domainkeys
  verbs:
  - '*'
- apiGroups:
  - operations.openkcm.io
  resources:
  - domainkeys/status
  verbs:
  - get
