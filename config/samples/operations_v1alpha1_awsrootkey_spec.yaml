apiVersion: operations.openkcm.io/v1alpha1
kind: AWSRootKey
metadata:
  name: aws-finance-l1-root
spec:
  tenantNameRef: ig-clean-account

  region: "us-east-1"
  keyUri: "arn:aws:kms:us-east-1:123456789012:key/mrk-8eb8379z0abcd"

  # Access key of an IAM user that may only assume this role. The access key ID and the secret access key are not
  # part of this resource: they sit in a Secret named awsrootkey-<name of this object>, in the same namespace,
  # labelled openkcm.io/root-key-credentials: "true", with the entries accessKeyId and secretAccessKey, and with an
  # ownerReference to this object. The UI creates this object first (complete, as shown), then the Secret.
  auth:
    method: AccessKey
    accessKey:
      roleArn: "arn:aws:iam::123456789012:role/Krypton-Tenant-Role"
      secretRef:
        name: awsrootkey-aws-finance-l1-root
        namespace: default
