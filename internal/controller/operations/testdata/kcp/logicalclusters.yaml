# Minimal stand-in for kcp's LogicalCluster so envtest can serve the object the
# reconcilers read the workspace path from. The kcp SDK ships Go types but no
# CRD manifests, and only metadata.annotations is read (see path.go).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: logicalclusters.core.kcp.io
spec:
  group: core.kcp.io
  scope: Cluster
  names:
    kind: LogicalCluster
    listKind: LogicalClusterList
    plural: logicalclusters
    singular: logicalcluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
