# Minimal stand-in for kcp's APIBinding so envtest can serve the object
# AccountBootstrapReconciler gates on. The kcp SDK ships Go types but no CRD
# manifests; only spec.reference.export.name and status.phase are read.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apibindings.apis.kcp.io
spec:
  group: apis.kcp.io
  scope: Cluster
  names:
    kind: APIBinding
    listKind: APIBindingList
    plural: apibindings
    singular: apibinding
  versions:
    - name: v1alpha2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
