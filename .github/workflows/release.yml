name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive version from tag
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare metadata
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/openkcm-controller" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest


  package-charts:
    needs: [publish-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - openkcm-operator
          - openkcm-pm-integration
    env:
      VERSION: ${{ needs.publish-image.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          chart='${{ matrix.chart }}'
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm lint "charts/${chart}"
          helm package "charts/${chart}" --version "$VERSION" --app-version "$VERSION"
          helm push "${chart}-${VERSION}.tgz" "oci://ghcr.io/${owner}/openkcm-controller/charts"
