name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version with the leading v, for example v0.12.0'
        required: true
        type: string
      dry_run:
        description: 'Build and package only, push nothing'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/openkcm/images/platform-mesh-controller
  CHARTS: oci://ghcr.io/openkcm/charts

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      push: ${{ steps.v.outputs.push }}
    steps:
      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            if [ "$INPUT_DRY_RUN" = "true" ]; then push=false; else push=true; fi
          else
            tag="$REF_NAME"
            push=true
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "The version must look like v1.2.3, got: $tag" >&2; exit 1 ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        if: needs.version.outputs.push == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PUSH: ${{ needs.version.outputs.push }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(
            --platform linux/amd64
            --file Dockerfile
            --provenance=false
            --label "org.opencontainers.image.source=https://github.com/${REPO}"
            --label "org.opencontainers.image.version=${TAG}"
            --tag "${IMAGE}:${TAG}"
          )
          if [ "$PUSH" = "true" ]; then args+=(--push); fi
          docker buildx build "${args[@]}" .

  charts:
    needs: [version, image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - platform-mesh-controller
          - pm-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.22.0

      - name: Log in to the chart registry
        if: needs.version.outputs.push == 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Package the chart
        env:
          CHART: ${{ matrix.chart }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          helm lint --strict "charts/${CHART}"
          helm package "charts/${CHART}" --version "$VERSION" --app-version "$VERSION"
          helm show chart "${CHART}-${VERSION}.tgz" | grep -E '^(name|version|appVersion):'

      - name: Push the chart
        if: needs.version.outputs.push == 'true'
        env:
          CHART: ${{ matrix.chart }}
          VERSION: ${{ needs.version.outputs.version }}
        run: helm push "${CHART}-${VERSION}.tgz" "$CHARTS"
