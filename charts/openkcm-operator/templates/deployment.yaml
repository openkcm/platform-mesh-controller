apiVersion: apps/v1
kind: Deployment
metadata:
  name: openkcm-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openkcm-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
  strategy: {}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "openkcm-operator.labels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
        - name: manager
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --kcp-kubeconfig=/etc/kcp/kubeconfig
            - --tenant-namespace={{ .Values.tenantNamespace }}
            - --operations-apiexport-endpointslice={{ .Values.operations.apiExportEndpointSliceName }}
            - --mock-api-addr={{ .Values.mockAPI.addr }}
            - --openkcm-api-url={{ .Values.openkcmAPI.url }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            # POD_NAMESPACE is used by the mock OpenKCM API server to
            # persist its state in a ConfigMap in the pod's own
            # namespace, so state survives pod restarts.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: kcp-kubeconfig
              mountPath: /etc/kcp
              readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: openkcm-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: kcp-kubeconfig
          secret:
            secretName: {{ .Values.kcpKubeconfig.secretName }}
