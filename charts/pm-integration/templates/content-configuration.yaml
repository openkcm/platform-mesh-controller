{{- $baseUrl := printf "%s://%s" (.Values.PUBLIC_SCHEME | default "https") (.Values.PUBLIC_HOST | default "localhost") }}
{{- $metadata := .Values.metadata | default dict }}
{{- $accountPath := get $metadata "accountContentPath" | default (get $metadata "contentPath" | default "/pm-content.json") }}
{{- $namespacePath := get $metadata "namespaceContentPath" | default "/pm-content-namespace.json" }}
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ContentConfiguration
metadata:
  name: openkcm
  labels:
    ui.platform-mesh.io/entity: core_platform-mesh_io_account
    ui.platform-mesh.io/content-for: operations.openkcm.io
spec:
  remoteConfiguration:
    url: {{ printf "%s%s" $baseUrl $accountPath | quote }}
    contentType: "json"
---
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ContentConfiguration
metadata:
  name: openkcm-namespace
  labels:
    # Platform Mesh contentconfigurations virtual-workspace selects provider
    # content by the KCP workspace level, not by the Luigi node entity. Keep the
    # metadata label account-scoped so the namespace Luigi node is returned for
    # account workspaces; the node payload itself remains account.namespace.
    ui.platform-mesh.io/entity: core_platform-mesh_io_account
    ui.platform-mesh.io/content-for: operations.openkcm.io
spec:
  remoteConfiguration:
    url: {{ printf "%s%s" $baseUrl $namespacePath | quote }}
    contentType: "json"
