{{- $marketplaceTitle := .Values.branding.marketplace.title -}}
{{- $marketplaceDescription := .Values.branding.marketplace.description -}}
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  # Marketplace discovery matches ProviderMetadata.name against APIExports
  # labeled with ui.platform-mesh.io/content-for=<provider-name>.
  # The account-scoped OpenKCM export publishes content-for=operations.openkcm.io,
  # so this identity must match that exact value.
  name: operations.openkcm.io
  labels:
    {{- include "pm-integration.labels" . | nindent 4 }}
spec:
  displayName: {{ $marketplaceTitle | quote }}
  description: |
{{ $marketplaceDescription | nindent 4 }}
  preferredSupportChannels:
    - displayName: OpenKCM Documentation
      url: https://openkcm.io
  icon:
    light:
      data: "data:image/svg+xml;base64,{{ (.Files.Get "files/icon.svg") | b64enc }}"
    dark:
      data: "data:image/svg+xml;base64,{{ (.Files.Get "files/icon.svg") | b64enc }}"
