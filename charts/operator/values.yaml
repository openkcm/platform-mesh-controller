image:
  repository: ghcr.io/openkcm/openkcm-controller
  tag: 0.10.9 # x-release-please-version
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

kcpKubeconfig:
  secretName: pm-kubeconfig

tenantNamespace: default

operations:
  apiExportEndpointSliceName: operations.openkcm.io

mockAPI:
  # Bind to localhost so only the in-pod controller can reach it.
  addr: "127.0.0.1:9443"

openkcmAPI:
  # Default: in-pod mock API server (same process as the controller).
  # Override with a real OpenKCM/Krypton endpoint when available.
  url: "http://127.0.0.1:9443"

krypton:
  # host:port of Krypton's admin gRPC API. When empty, Tenant, DomainKey,
  # ServiceKey and DataEncryptionKey reconciliation keep using the mock above;
  # when set, they talk to Krypton instead.
  #
  # Leave empty until the transport is settled: the client currently dials in
  # plaintext, while the showroom gateway expects a bearer token and has no
  # mTLS configured. Pointing this at the gateway today will fail to
  # authenticate.
  grpcAddr: ""
