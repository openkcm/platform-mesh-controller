apiVersion: apis.kcp.io/v1alpha2
kind: APIExport
metadata:
  name: operations.openkcm.io
  labels:
    # Marketplace/ContentConfigurations virtual-workspace filters on content-for
    # = APIExport name. Must match `operations.openkcm.io` verbatim.
    ui.platform-mesh.io/content-for: operations.openkcm.io
spec:
  resources:
    - group: operations.openkcm.io
      name: tenants
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.tenants.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: domainkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.domainkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: servicekeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.servicekeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: awsrootkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.awsrootkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: azurerootkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.azurerootkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: openbaorootkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.openbaorootkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: gcprootkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.gcprootkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: vaultrootkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.vaultrootkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: hsmrootkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.hsmrootkeys.operations.openkcm.io
      storage:
        crd: {}
    - group: operations.openkcm.io
      name: dataencryptionkeys
      schema: {{ printf "v%s-v1alpha1" (.Chart.Version | replace "." "-") }}.dataencryptionkeys.operations.openkcm.io
      storage:
        crd: {}
  permissionClaims:
    - group: ""
      resource: namespaces
      verbs: ["*"]
    - group: ""
      resource: events
      verbs: ["*"]
    # Controllers derive account identity from the KCP workspace path.
    - group: core.kcp.io
      resource: logicalclusters
      verbs: ["get", "list", "watch"]
    # AccountBootstrapReconciler is triggered by the marketplace-created
    # operations.openkcm.io APIBinding in the account workspace.
    - group: apis.kcp.io
      resource: apibindings
      verbs: ["get", "list", "watch"]
