# Grants `bind` on this provider's APIExports to the identity the Platform
# Mesh portal uses when minting an APIBinding from the marketplace.
# Same shape as every other provider (chat-ui, private-llm, cncf-postgres,
# metal-api): ClusterRole gating bind + ClusterRoleBinding to system:anonymous.
# Applied unconditionally — the portal flow requires it to work.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apiexport-bind
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: anonymous-view
subjects:
  - kind: User
    name: system:anonymous
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: apiexport-bind
  apiGroup: rbac.authorization.k8s.io
