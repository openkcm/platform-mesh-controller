{{- $baseUrl := printf "%s://%s" (.Values.publicScheme | default "https") (.Values.publicHost | default "localhost") -}}
{{- $accountPath := .Values.metadata.contentPath | default "/pm-content.json" -}}
apiVersion: ui.platform-mesh.io/v1alpha1
kind: ContentConfiguration
metadata:
  name: openkcm
  labels:
    {{- include "platform-mesh-integration.labels" . | nindent 4 }}
    ui.platform-mesh.io/entity: core_platform-mesh_io_account
    ui.platform-mesh.io/content-for: operations.openkcm.io
spec:
  remoteConfiguration:
    url: {{ printf "%s%s" $baseUrl $accountPath | quote }}
    contentType: "json"
