apiVersion: v2
name: platform-mesh-controller
description: >-
  OpenKCM integration into Platform Mesh: the controller that reconciles the OpenKCM key
  resources of the kcp account workspaces, with the operations.openkcm.io CRDs.
type: application
# Version of the chart. Increment it for every change to the chart; 0.10.9 is published.
version: 0.11.0
# Controller release this chart deploys; the image tag is image.tag in values.yaml. release-please
# updates both lines (marker).
appVersion: "0.0.3" # x-release-please-version
kubeVersion: ">=1.22.0-0"
keywords:
  - apeiro
  - openkcm
  - platform mesh
sources:
  - https://github.com/openkcm/platform-mesh-controller
maintainers:
  - name: OpenKCM
    url: https://openkcm.io
