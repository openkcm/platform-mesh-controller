{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform-mesh-controller.fullname" . }}
  namespace: {{ include "platform-mesh-controller.namespace" . }}
  labels:
    {{- include "platform-mesh-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "platform-mesh-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: metrics
          protocol: TCP
        - port: health
          protocol: TCP
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
