{{- if and .Values.prometheus.enabled .Values.prometheus.servicemonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "platform-mesh-controller.fullname" . }}
  namespace: {{ .Values.prometheus.servicemonitor.namespace | default (include "platform-mesh-controller.namespace" .) }}
  labels:
    {{- include "platform-mesh-controller.labels" . | nindent 4 }}
    {{- with .Values.prometheus.servicemonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheus.servicemonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "platform-mesh-controller.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.prometheus.servicemonitor.targetPort }}
      path: {{ .Values.prometheus.servicemonitor.path }}
      {{- with .Values.prometheus.servicemonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.prometheus.servicemonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      honorLabels: {{ .Values.prometheus.servicemonitor.honorLabels }}
      {{- with .Values.prometheus.servicemonitor.endpointAdditionalProperties }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
