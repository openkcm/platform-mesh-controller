apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-mesh-controller-manager
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - operations.openkcm.io
    resources:
      - tenants
      - domainkeys
      - servicekeys
      - awsrootkeys
      - azurerootkeys
      - openbaorootkeys
      - dataencryptionkeys
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - operations.openkcm.io
    resources:
      - tenants/status
      - domainkeys/status
      - servicekeys/status
      - awsrootkeys/status
      - azurerootkeys/status
      - openbaorootkeys/status
      - dataencryptionkeys/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - operations.openkcm.io
    resources:
      - tenants/finalizers
      - domainkeys/finalizers
      - servicekeys/finalizers
      - awsrootkeys/finalizers
      - azurerootkeys/finalizers
      - openbaorootkeys/finalizers
      - dataencryptionkeys/finalizers
    verbs:
      - update
  - apiGroups:
      - apis.kcp.io
    resources:
      - apibindings
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - core.kcp.io
    resources:
      - logicalclusters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Mock API persistence stores state in an in-cluster ConfigMap.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Metrics auth
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-mesh-controller-manager
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-mesh-controller-manager
subjects:
  - kind: ServiceAccount
    name: platform-mesh-controller-manager
    namespace: {{ .Release.Namespace }}
