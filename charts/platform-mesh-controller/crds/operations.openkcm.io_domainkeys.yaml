---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: domainkeys.operations.openkcm.io
spec:
  group: operations.openkcm.io
  names:
    kind: DomainKey
    listKind: DomainKeyList
    plural: domainkeys
    singular: domainkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.tenantNameRef
      name: Tenant
      type: string
    - jsonPath: .spec.primaryRootKeyRef.name
      name: RootKey
      type: string
    - jsonPath: .status.cryptoState.lifecycleState
      name: Lifecycle
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DomainKey enables OpenKCM encryption for a specific Team or BusinessUnit
          under a Tenant. Links upwards to an L1 root key via primaryRootKeyRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DomainKey
            properties:
              fallbackRootKeyRefs:
                description: |-
                  FallbackRootKeyRefs is an optional list of fallback L1 references
                  for multi-root scenarios (multi-cloud / multi-region / multi-AZ).
                items:
                  description: |-
                    TypedReference is a polymorphic reference to a resource identified by
                    apiGroup + kind + namespace + name. Used where the referent kind varies
                    (e.g. DomainKey.spec.primaryRootKeyRef accepts any L1 root-key kind).
                  properties:
                    apiGroup:
                      description: APIGroup is the API group of the referenced resource.
                      type: string
                    kind:
                      description: Kind is the kind of the referenced resource.
                      type: string
                    name:
                      description: Name is the name of the referenced resource.
                      type: string
                    namespace:
                      description: |-
                        Namespace is the namespace of the referenced resource. Empty keeps the
                        historical same-namespace behavior.
                      type: string
                  required:
                  - apiGroup
                  - kind
                  - name
                  type: object
                type: array
              lifecycle:
                default: Active
                description: |-
                  Lifecycle is the user-desired key lifecycle. Defaults to Active.
                  Setting to Deactivated cascades to all ServiceKeys under this domain
                  and their Data Encryption Keys.
                enum:
                - Active
                - Deactivated
                type: string
              primaryRootKeyRef:
                description: |-
                  PrimaryRootKeyRef points at the L1 root key that backs this
                  DomainKey. Polymorphic across the L1 kinds. Optional so the
                  AccountBootstrapReconciler can auto-create the singleton DomainKey
                  at APIBinding creation before any L1 has been registered. The
                  DomainKey reconciler surfaces Ready=False with reason
                  AwaitingPrimaryRootKey while the field is unset; once the user
                  links an Active L1 via Edit (or kubectl), reconciliation resumes.
                properties:
                  apiGroup:
                    description: APIGroup is the API group of the referenced resource.
                    type: string
                  kind:
                    description: Kind is the kind of the referenced resource.
                    type: string
                  name:
                    description: Name is the name of the referenced resource.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced resource. Empty keeps the
                      historical same-namespace behavior.
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
              scope:
                default: Namespace
                description: |-
                  Scope limits the ServiceKeys under this DomainKey: an Instance DomainKey
                  serves exactly one ServiceKey, a Namespace DomainKey any number.
                enum:
                - Instance
                - Namespace
                - System
                type: string
                x-kubernetes-validations:
                - message: scope is immutable
                  rule: self == oldSelf
              tenantNameRef:
                description: |-
                  TenantNameRef is the account-name of the owning Tenant. Advisory;
                  the reconciler derives the canonical tenant identity from the
                  workspace path (showroom#203).
                type: string
              type:
                description: Type categorises the DomainKey scope.
                enum:
                - Team
                - BusinessUnit
                type: string
            required:
            - tenantNameRef
            - type
            type: object
          status:
            description: status defines the observed state of DomainKey
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the DomainKey's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cryptoState:
                description: CryptoState represents the Krypton cryptographic business
                  state.
                properties:
                  id:
                    description: ID is the Krypton-assigned key UUID.
                    type: string
                  lastRotatedAt:
                    description: LastRotatedAt is the last key rotation timestamp.
                    format: date-time
                    type: string
                  lifecycleState:
                    description: LifecycleState is the key lifecycle state.
                    enum:
                    - PreActive
                    - Active
                    - Suspended
                    - Deactivated
                    - Compromised
                    - Destroyed
                    type: string
                  version:
                    description: Version is the key version number.
                    format: int32
                    type: integer
                type: object
              observedGeneration:
                description: ObservedGeneration is the last observed generation.
                format: int64
                type: integer
              operationId:
                description: OperationID is the Krypton-side correlation UUID for
                  the most recent operation.
                type: string
              reconciliationStatus:
                description: ReconciliationStatus carries the most recent reconciliation
                  outcome.
                properties:
                  errors:
                    description: Errors collects diagnostic strings for the current
                      cycle. Empty on success.
                    items:
                      type: string
                    type: array
                  identityInfo:
                    description: |-
                      IdentityInfo carries the upstream-provider identity for L1 kinds.
                      Only populated when meaningful (i.e. L1 reconcilers).
                    properties:
                      certificateSecretRef:
                        description: |-
                          CertificateSecretRef points at the CA bundle backing the identity
                          chain (e.g. ca.crt used to validate the upstream KMS endpoint).
                        properties:
                          key:
                            description: Key is the data-map key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: Namespace the Secret lives in.
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      subject:
                        description: |-
                          Subject is the certificate subject DN (or equivalent identity claim)
                          presented to the upstream provider.
                        type: string
                    type: object
                  internalKeyId:
                    description: |-
                      InternalKeyID is the OpenKCM-internal identifier for the key bound by
                      this reconciliation. Distinct from CryptoState.ID, which is the
                      Krypton-side business UUID.
                    type: string
                  lastTransitionTime:
                    description: |-
                      LastTransitionTime is the timestamp of the most recent successful or
                      failed reconciliation transition.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable outcome description.
                    type: string
                  success:
                    description: Success is true when the last reconciliation cycle
                      completed without error.
                    type: boolean
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
